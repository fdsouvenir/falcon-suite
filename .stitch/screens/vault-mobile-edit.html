<!-- Micro-interactions Script -->
<script>
    // Password mask toggle micro-interaction
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('field-password');
    
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');
        
        if (isPassword) {
          pwdInput.setAttribute('type', 'text');
          iconSpan.textContent = 'visibility_off';
          iconSpan.setAttribute('data-icon', 'visibility_off');
        } else {
          pwdInput.setAttribute('type', 'password');
          iconSpan.textContent = 'visibility';
          iconSpan.setAttribute('data-icon', 'visibility');
        }
      });
    }
  </script>
